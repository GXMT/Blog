media:
  input: public/images
  output: /images

content:
  - name: posts
    label: 기록
    type: collection
    path: src/content/blog
    filename: '{fields.title}.md'
    view:
      fields: [title, pubDate, draft]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - { name: title, label: 제목, type: string, required: true }
      - {
          name: description,
          label: 요약 (검색 결과·공유 미리보기),
          type: text,
          required: true,
        }
      - {
          name: pubDate,
          label: 발행일,
          type: date,
          options: { format: yyyy-MM-dd },
          required: true,
        }
      - {
          name: updatedDate,
          label: 수정일 (선택),
          type: date,
          options: { format: yyyy-MM-dd },
        }
      - { name: heroImage, label: 대표 이미지 (선택), type: image }
      - { name: heroAlt, label: 대표 이미지 대체 텍스트 (선택), type: string }
      - {
          name: tags,
          label: 태그 (첫 번째 태그가 메인 화면 단어),
          type: string,
          list: true,
        }
      - {
          name: draft,
          label: 초안 (체크하면 사이트에 표시 안 됨),
          type: boolean,
          default: false,
        }
      - { name: body, label: 본문, type: rich-text }

  - name: channels
    label: 연락처·판매처
    type: file
    path: src/data/channels.json
    format: json
    fields:
      - { name: phone, label: 전화번호, type: string }
      - name: socials
        label: SNS
        type: object
        list: true
        fields:
          - { name: name, label: 이름, type: string }
          - { name: url, label: 주소, type: string }
      - name: stores
        label: 판매 플랫폼 (주소가 빈 플랫폼은 사이트에 안 보임)
        type: object
        list: true
        fields:
          - { name: id, label: 식별자 (영문), type: string }
          - { name: name, label: 표시 이름, type: string }
          - { name: url, label: 스토어 주소, type: string }
      - name: products
        label: 상품
        type: object
        list: true
        fields:
          - { name: id, label: 식별자 (영문), type: string }
          - { name: name, label: 상품명, type: string }
          - { name: image, label: '이미지 경로 (예: /media/box.webp)', type: string }
          - name: links
            label: 플랫폼별 상품 주소 (비우면 스토어 주소로 연결)
            type: object
            list: true
            fields:
              - { name: store, label: 플랫폼 식별자, type: string }
              - { name: url, label: 상품 주소, type: string }
