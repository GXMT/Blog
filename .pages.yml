media:
  input: public/images
  output: /images

content:
  - name: posts
    label: 기록
    type: collection
    path: src/content/blog
    filename: '{fields.title}.md'
    view:
      fields: [title, pubDate, draft]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - { name: title, label: 제목, type: string, required: true }
      - {
          name: description,
          label: 요약 (검색 결과·공유 미리보기),
          type: text,
          required: true,
        }
      - {
          name: pubDate,
          label: 발행일,
          type: date,
          options: { format: yyyy-MM-dd },
          required: true,
        }
      - {
          name: updatedDate,
          label: 수정일 (선택),
          type: date,
          options: { format: yyyy-MM-dd },
        }
      - { name: heroImage, label: 대표 이미지 (선택), type: image }
      - { name: heroAlt, label: 대표 이미지 대체 텍스트 (선택), type: string }
      - {
          name: tags,
          label: 태그 (첫 번째 태그가 메인 화면 단어),
          type: string,
          list: true,
        }
      - {
          name: draft,
          label: 초안 (체크하면 사이트에 표시 안 됨),
          type: boolean,
          default: false,
        }
      - { name: body, label: 본문, type: rich-text }
